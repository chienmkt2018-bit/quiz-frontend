<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="siteTitleTag">Trang Web Học Tập Của MR Minh</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* GIỮ NGUYÊN CSS CŨ (Phần Root, Darkmode, Container, Card...) */
        :root { --primary-color: #3498db; --bg-color: #f4f7f6; --container-bg: #ffffff; --text-color: #333333; --card-bg: #fafafa; --border-color: #e0e0e0; --input-bg: #ffffff; --input-border: #cccccc; --header-bg: #eef2f5; --table-bg: #ffffff; --th-bg: #f2f2f2; --title-color: #2c3e50; }
        .dark-mode { --bg-color: #121212; --container-bg: #1e1e1e; --text-color: #e0e0e0; --card-bg: #2c2c2c; --border-color: #444444; --input-bg: #333333; --input-border: #555555; --header-bg: #2a2a2a; --table-bg: #2c2c2c; --th-bg: #3a3a3a; --title-color: #f39c12; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 850px; background: var(--container-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--header-bg); padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .user-profile-bar { display: flex; align-items: center; gap: 12px; }
        .user-avatar-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-color); }
        .mcion-badge { display: inline-flex; align-items: center; background: linear-gradient(135deg, #f1c40f, #f39c12); color: #fff; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        .card-box { border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; margin-bottom: 20px; background: var(--card-bg); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], input[type="number"], select, textarea { width: 100%; padding: 12px; border: 1px solid var(--input-border); border-radius: 6px; font-size: 14px; background: var(--input-bg); color: var(--text-color); resize: vertical; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        button { padding: 12px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-success { background-color: #2ecc71; color: white; }
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-warning { background-color: #f39c12; color: white; }
        .btn-link { background: none; color: var(--primary-color); border: none; padding: 0; text-decoration: underline; cursor: pointer; }
        .question-card { background: var(--container-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .question-title { font-weight: bold; margin-bottom: 10px; color: var(--title-color); }
        .option-item { margin: 6px 0; display: flex; align-items: center; cursor: pointer; padding: 8px 12px; border-radius: 6px; }
        .hidden { display: none !important; }
        .correct-choice { background-color: rgba(40, 167, 69, 0.15) !important; border: 1px solid #28a745 !important; color: #28a745 !important; }
        .wrong-choice { background-color: rgba(220, 53, 69, 0.15) !important; border: 1px solid #dc3545 !important; color: #dc3545 !important; text-decoration: line-through; }
        .answer-explanation { margin-top: 10px; padding: 10px 15px; border-radius: 6px; font-size: 14px; }
        .answer-explanation.correct { background: rgba(46, 204, 113, 0.1); border-left: 4px solid #2ecc71; }
        .answer-explanation.wrong { background: rgba(231, 76, 60, 0.1); border-left: 4px solid #e74c3c; }
        .answer-explanation.ai-feedback { background: rgba(52, 152, 219, 0.1); border-left: 4px solid #3498db; }
        
        /* Toast thông báo lưu nháp */
        #autosaveToast { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 12px; opacity: 0; transition: opacity 0.5s; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body>

<div id="autosaveToast">💾 Đã lưu nháp tự động</div>

<div class="container">
    <h2 id="mainTitle" class="main-title" style="text-align: center; margin-bottom: 20px;">Hệ Thống Trắc Nghiệm & Tự Luận</h2>
    
    <div class="top-bar">
        <div class="user-profile-bar">
            <img id="topUserAvatar" class="user-avatar-img hidden" src="">
            <div><b>Trạng thái: </b><span id="userInfo">Chưa đăng nhập</span></div>
        </div>
        <div>
            <div id="mcionBox" class="mcion-badge hidden">🪙 Mcion: <span id="userMcionBalance">0</span></div>
            <button id="btnToggleTheme" class="btn-theme-toggle">🌙</button>
            <button id="btnLogout" class="btn-danger hidden">Đăng Xuất</button>
        </div>
    </div>

    <!-- KHU VỰC HỌC SINH -->
    <div id="sectionStudent" class="hidden">
        <div class="card-box" id="examSelectionArea">
            <h3>🎯 Chọn Đề Thi (Hỗ trợ Tự Luận)</h3>
            <div class="form-group" style="margin-top:15px;">
                <select id="selectExamCode"><option value="">-- Chọn Đề --</option></select>
            </div>
            <button id="btnStartExam" class="btn-success" style="width: 100%;">🚀 BẮT ĐẦU LÀM BÀI</button>
        </div>

        <div id="examArea" class="card-box hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="examTitle" style="margin: 0;">Bài Thi</h3>
                <div id="examTimerDisplay" class="mcion-badge hidden" style="background: linear-gradient(135deg, #e74c3c, #c0392b);">
                    ⏱️ <span id="timeRemaining">--:--</span>
                </div>
            </div>
            <div id="questionsContainer"></div>
            <button id="btnSubmitExam" class="btn-primary" style="width: 100%; padding: 12px; margin-top: 15px;">NỘP BÀI (Chờ AI Chấm)</button>
        </div>

        <div class="card-box">
            <h3>📜 Lịch Sử Gần Đây (Có Thể Phúc Khảo)</h3>
            <table style="width: 100%; text-align: left; margin-top:10px;" id="historyTable">
                <thead><tr><th>Mã Đề</th><th>Số Đúng</th><th>Điểm AI</th><th>Hành Động</th></tr></thead>
                <tbody id="myHistoryRecentBody"></tbody>
            </table>
        </div>
    </div>

    <!-- KHU VỰC ADMIN -->
    <div id="sectionAdmin" class="hidden">
        <div class="card-box">
            <h3>Thêm Mới Đề Thi Tự Luận / Trắc Nghiệm (Bằng Excel)</h3><br>
            <div class="form-group"><label>Mã Đề Thi:</label><input type="text" id="inputExamCode"></div>
            <div class="form-group"><label>Thời Gian Làm Bài (Phút):</label><input type="number" id="inputExamTime" value="15"></div>
            <div class="form-group"><label>Chọn File Excel (Cột F ghi "TL" cho tự luận, Cột G là Dàn Ý, H là Điểm Tối Đa):</label><input type="file" id="excelFileInput"></div>
            <button id="btnSaveExam" class="btn-success">Lưu Bộ Đề</button>
        </div>
    </div>

    <!-- Auth Section Gắn Tạm Của Giao Diện Cũ Để Đăng Nhập -->
    <div id="sectionAuth" class="card-box">
        <h3>Đăng Nhập</h3>
        <div class="form-group"><input type="text" id="authUsername" placeholder="Tên đăng nhập"></div>
        <div class="form-group"><input type="password" id="authPassword" placeholder="Mật khẩu"></div>
        <div class="btn-group">
            <button id="btnLoginStudent" class="btn-primary">Đăng Nhập Học Sinh</button>
            <button id="btnLoginAdmin" class="btn-warning">Admin</button>
        </div>
    </div>
</div>

<script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const API_URL = isLocal ? "http://localhost:3000/api" : "https://quiz-backend-ta9z.onrender.com/api";
    
    let currentExamData = null;
    let examTimerInterval = null;
    let autoSaveInterval = null;

    function escapeHtml(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    async function fetchAuth(url, options = {}) {
        const token = sessionStorage.getItem("access_token");
        const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        return await fetch(url, { ...options, headers });
    }

    // AUTH LOGIN GIỮ NGUYÊN TỪ PHIÊN BẢN CŨ
    async function handleLogin(role) {
        const username = document.getElementById('authUsername').value, password = document.getElementById('authPassword').value;
        const res = await fetch(`${API_URL}/login`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username, password, role})});
        const data = await res.json();
        if (data.success) {
            sessionStorage.setItem("current_user", JSON.stringify(data));
            sessionStorage.setItem("access_token", data.token);
            checkLoginState();
        } else alert(data.message);
    }
    document.getElementById('btnLoginStudent').onclick = () => handleLogin('student');
    document.getElementById('btnLoginAdmin').onclick = () => handleLogin('admin');
    document.getElementById('btnLogout').onclick = () => { sessionStorage.clear(); checkLoginState(); };

    function checkLoginState() {
        const user = JSON.parse(sessionStorage.getItem("current_user"));
        document.getElementById('sectionAuth').classList.toggle('hidden', !!user);
        document.getElementById('btnLogout').classList.toggle('hidden', !user);
        
        if (!user) {
            document.getElementById('sectionStudent').classList.add('hidden');
            document.getElementById('sectionAdmin').classList.add('hidden');
        } else if (user.role === 'student') {
            document.getElementById('sectionStudent').classList.remove('hidden');
            document.getElementById('sectionAdmin').classList.add('hidden');
            document.getElementById('userInfo').textContent = user.fullname;
            loadExamList(); loadHistory(); updateMcion();
        } else {
            document.getElementById('sectionAdmin').classList.remove('hidden');
            document.getElementById('sectionStudent').classList.add('hidden');
            document.getElementById('userInfo').textContent = 'Admin';
        }
    }

    // EXCEL IMPORT - NHẬN DIỆN CÂU HỎI TỰ LUẬN
    document.getElementById('btnSaveExam').addEventListener('click', () => {
        const examCode = document.getElementById('inputExamCode').value;
        const timeLimit = document.getElementById('inputExamTime').value;
        const file = document.getElementById('excelFileInput').files[0];
        if(!examCode || !file) return alert("Thiếu dữ liệu!");

        const reader = new FileReader();
        reader.onload = async (e) => {
            const rows = XLSX.utils.sheet_to_json(XLSX.read(new Uint8Array(e.target.result), {type:'array'}).Sheets[XLSX.read(new Uint8Array(e.target.result), {type:'array'}).SheetNames[0]], {header:1});
            const questions = [];
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i]; if(!row[0]) continue;
                let isEssay = (String(row[5]).toUpperCase().includes('TL') || String(row[5]).toUpperCase().includes('TỰ LUẬN'));
                
                questions.push({
                    id: i, question: String(row[0]),
                    type: isEssay ? 'essay' : 'multiple_choice',
                    options: isEssay ? [] : [row[1], row[2], row[3], row[4]].filter(Boolean),
                    correct: isEssay ? null : (row[5] === 1 ? 'A' : row[5] === 2 ? 'B' : row[5] === 3 ? 'C' : row[5]),
                    sampleAnswer: isEssay ? (row[6] || '') : null,
                    maxScore: isEssay ? (Number(row[7]) || 10) : null
                });
            }
            const res = await fetchAuth(`${API_URL}/exams`, { method:'POST', body: JSON.stringify({examCode, timeLimit, questions})});
            if((await res.json()).success) alert("Lưu đề thành công!");
        };
        reader.readAsArrayBuffer(file);
    });

    async function loadExamList() {
        const res = await fetchAuth(`${API_URL}/exams`);
        const exams = await res.json();
        document.getElementById('selectExamCode').innerHTML = '<option value="">-- Chọn Đề --</option>' + exams.map(e => `<option value="${e.examCode}">${e.examCode}</option>`).join('');
    }

    // BẮT ĐẦU & RENDER BÀI LÀM (GỒM TỰ LUẬN + AUTO SAVE)
    document.getElementById('btnStartExam').addEventListener('click', async () => {
        const code = document.getElementById('selectExamCode').value;
        if(!code) return;
        const res = await fetchAuth(`${API_URL}/exams/${code}`);
        currentExamData = await res.json();
        
        document.getElementById('examArea').classList.remove('hidden');
        document.getElementById('examSelectionArea').classList.add('hidden');
        
        const container = document.getElementById('questionsContainer');
        container.innerHTML = currentExamData.questions.map((q, idx) => {
            if (q.type === 'essay') {
                const draft = localStorage.getItem(`draft_${code}_${idx}`) || '';
                return `<div class="question-card" id="q_${idx}">
                    <div class="question-title">Câu ${idx+1} (Tự luận - ${q.maxScore || 10}đ): ${escapeHtml(q.question)}</div>
                    <textarea class="essay-box" id="ans_${idx}" rows="6" placeholder="Viết câu trả lời của bạn vào đây...">${escapeHtml(draft)}</textarea>
                </div>`;
            } else {
                const labels = ['A','B','C','D'];
                const opts = q.options.map((opt, oIdx) => `<label class="option-item"><input type="radio" name="q${idx}" value="${labels[oIdx]}"> ${labels[oIdx]}. ${escapeHtml(opt)}</label>`).join('');
                return `<div class="question-card" id="q_${idx}"><div class="question-title">Câu ${idx+1}: ${escapeHtml(q.question)}</div>${opts}</div>`;
            }
        }).join('');

        // Bật Auto-Save
        clearInterval(autoSaveInterval);
        autoSaveInterval = setInterval(() => {
            document.querySelectorAll('.essay-box').forEach(ta => {
                const idx = ta.id.split('_')[1];
                localStorage.setItem(`draft_${code}_${idx}`, ta.value);
            });
            const t = document.getElementById('autosaveToast');
            t.style.opacity = '1'; setTimeout(() => t.style.opacity = '0', 2000);
        }, 30000);
    });

    // NỘP BÀI - GỬI DATA VỀ SERVER AI CHẤM
    document.getElementById('btnSubmitExam').addEventListener('click', async function() {
        if(this.dataset.state === 'done') {
            document.getElementById('examArea').classList.add('hidden');
            document.getElementById('examSelectionArea').classList.remove('hidden');
            this.textContent = "NỘP BÀI (Chờ AI Chấm)"; delete this.dataset.state; return;
        }

        const btn = this;
        btn.textContent = "⏳ Đang gửi cho AI chấm điểm... Vui lòng không đóng trang!";
        btn.disabled = true;
        clearInterval(autoSaveInterval);
        
        let answers = {};
        currentExamData.questions.forEach((q, idx) => {
            if(q.type === 'essay') {
                answers[idx] = document.getElementById(`ans_${idx}`).value;
                localStorage.removeItem(`draft_${currentExamData.examCode}_${idx}`); // Xóa nháp
            } else {
                answers[idx] = document.querySelector(`input[name="q${idx}"]:checked`)?.value || '';
            }
        });

        try {
            const res = await fetchAuth(`${API_URL}/submit`, { method: 'POST', body: JSON.stringify({ examCode: currentExamData.examCode, answers, time: new Date().toLocaleString() }) });
            const data = await res.json();
            
            if(data.success) {
                alert(`Nộp bài thành công!\nĐiểm tổng: ${data.history.score}`);
                // Hiển thị Nhận xét AI trên UI
                data.history.essayDetails.forEach(ed => {
                    const box = document.getElementById(`q_${ed.questionIndex}`);
                    const div = document.createElement('div');
                    let confWarning = ed.confidence < 70 ? `<br><small style="color:red">Độ tin cậy AI thấp (${ed.confidence}%). Khuyên dùng tính năng Phúc Khảo.</small>` : '';
                    div.className = 'answer-explanation ai-feedback';
                    div.innerHTML = `🤖 <b>AI Nhận xét:</b> ${escapeHtml(ed.feedback)} <br>👉 <b>Điểm AI chấm:</b> ${ed.score}đ ${confWarning}`;
                    box.appendChild(div);
                });
                
                btn.textContent = "✖️ ĐÓNG KẾT QUẢ"; btn.dataset.state = 'done';
                loadHistory(); updateMcion();
            } else {
                alert("Lỗi: " + data.message);
                btn.textContent = "NỘP BÀI";
            }
        } catch(e) { alert("Lỗi mạng!"); btn.textContent = "NỘP BÀI"; }
        btn.disabled = false;
    });

    async function loadHistory() {
        const u = JSON.parse(sessionStorage.getItem("current_user"));
        const res = await fetchAuth(`${API_URL}/history?search=${u.username}`);
        const list = await res.json();
        
        document.getElementById('myHistoryRecentBody').innerHTML = list.map(h => {
            const btnRegrade = h.regradeRequested ? `<button disabled>Đã yêu cầu</button>` : `<button class="btn-warning" onclick="requestRegrade('${h.id}')" style="padding: 5px 10px; font-size:12px;">Phúc khảo</button>`;
            return `<tr><td>${h.examCode}</td><td>${h.correctCount}</td><td><b>${h.score}đ</b></td><td>${btnRegrade}</td></tr>`;
        }).join('');
    }

    window.requestRegrade = async function(id) {
        if(!confirm("Bạn có chắc muốn gửi yêu cầu giáo viên chấm lại bài này?")) return;
        const res = await fetchAuth(`${API_URL}/regrade`, { method: 'POST', body: JSON.stringify({ historyId: id }) });
        if((await res.json()).success) { alert("Đã gửi yêu cầu!"); loadHistory(); }
    };

    async function updateMcion() {
        const u = JSON.parse(sessionStorage.getItem("current_user"));
        const res = await fetchAuth(`${API_URL}/mcion/${u.username}`);
        const data = await res.json();
        document.getElementById('userMcionBalance').textContent = data.balance;
        document.getElementById('mcionBox').classList.remove('hidden');
    }

    checkLoginState();
</script>
</body>
</html>
