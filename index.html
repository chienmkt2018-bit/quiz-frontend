<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Web Học Tập - MR Minh</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #3498db; --bg: #f4f7f6; --card: #ffffff; --text: #333; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; background: var(--card); padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #eef2f5; padding: 12px 18px; border-radius: 8px; margin-bottom: 20px; }
        .card-box { border: 1px solid #ddd; padding: 18px; border-radius: 8px; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; }
        label { font-weight: bold; display: block; margin-bottom: 4px; }
        input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: var(--primary); color: #fff; margin-right: 5px; }
        .btn-success { background: #2ecc71; } .btn-danger { background: #e74c3c; } .btn-warning { background: #f39c12; }
        .avatar-badge { font-size: 24px; vertical-align: middle; cursor: pointer; }
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 10px; }
        .shop-item { border: 1px solid #ccc; border-radius: 8px; padding: 12px; text-align: center; background: #fafafa; }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; margin-bottom: 15px;">🎓 Web Học Tập MR Minh</h2>

    <!-- Top Bar -->
    <div class="top-bar">
        <div>
            <span id="userAvatar" class="avatar-badge" title="Bấm để đổi Avatar" onclick="openShopModal()">🎓</span>
            <b> Tên: </b><span id="userInfo">Chưa đăng nhập</span>
        </div>
        <div>
            <span id="mcionBox" class="hidden" style="margin-right:15px; font-weight:bold; color:#f39c12;">🪙 Mcion: <span id="userMcion">0</span></span>
            <button id="btnShop" class="btn-warning hidden" onclick="openShopModal()">🛒 Shop Avatar</button>
            <button id="btnLogout" class="btn-danger hidden" onclick="logout()">Đăng Xuất</button>
        </div>
    </div>

    <!-- AUTH SECTION -->
    <div id="sectionAuth" class="card-box">
        <h3>Đăng Nhập</h3><br>
        <div class="form-group"><label>Tên đăng nhập:</label><input type="text" id="authUsername"></div>
        <div class="form-group"><label>Mật khẩu:</label><input type="password" id="authPassword"></div>
        <button onclick="handleLogin('student')">Học Sinh Đăng Nhập</button>
        <button onclick="handleLogin('admin')" class="btn-warning">Admin Đăng Nhập</button>
    </div>

    <!-- STUDENT SECTION -->
    <div id="sectionStudent" class="hidden">
        <!-- BỘ LỌC PHÂN LOẠI MÔN HỌC VÀ LỚP HỌC -->
        <div class="card-box">
            <h3>🔍 Phân Loại Đề Thi</h3>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <div style="flex:1;">
                    <label>Lớp / Khối:</label>
                    <select id="filterGrade" onchange="loadExamList()">
                        <option value="Tất cả">-- Tất cả Khối Lớp --</option>
                        <option value="Lớp 10">Lớp 10</option>
                        <option value="Lớp 11">Lớp 11</option>
                        <option value="Lớp 12">Lớp 12</option>
                    </select>
                </div>
                <div style="flex:1;">
                    <label>Môn Học:</label>
                    <select id="filterSubject" onchange="loadExamList()">
                        <option value="Tất cả">-- Tất cả Môn Học --</option>
                        <option value="Toán">Toán Hóa</option>
                        <option value="Văn">Ngữ Văn</option>
                        <option value="Tiếng Anh">Tiếng Anh</option>
                        <option value="Vật Lý">Vật Lý</option>
                        <option value="Tổng hợp">Tổng hợp</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top:15px;">
                <label>Chọn Đề Thi:</label>
                <select id="selectExamCode"><option value="">-- Chọn đề --</option></select>
            </div>
            <button onclick="startExam()" class="btn-success" style="width: 100%;">🚀 BẮT ĐẦU THI</button>
        </div>

        <!-- BÀI THI AREA -->
        <div id="examArea" class="card-box hidden">
            <h3 id="examTitle">Bài Thi</h3>
            <div id="questionsContainer" style="margin-top:15px;"></div>
            <button onclick="submitExam()" class="btn-primary" style="width: 100%; margin-top:15px;">NỘP BÀI</button>
        </div>
    </div>

    <!-- SHOP & TỦ ĐỒ AVATAR MODAL -->
    <div id="sectionShop" class="card-box hidden">
        <div style="display:flex; justify-between; align-items:center;">
            <h3>🛒 Shop & Kho Avatar Của Bạn</h3>
            <button onclick="closeShopModal()" class="btn-danger">Đóng X</button>
        </div>
        <p style="margin-top:5px; font-size:14px; color:#666;">Chọn Avatar đã sở hữu để đổi, hoặc dùng Mcion mua Avatar mới!</p>
        <div id="shopListGrid" class="shop-grid"></div>
    </div>

    <!-- ADMIN SECTION -->
    <div id="sectionAdmin" class="hidden card-box">
        <h3>➕ Thêm Đề Thi Mới (Phân Loại Lớp & Môn)</h3>
        <div class="form-group"><label>Mã Đề Thi:</label><input type="text" id="inputExamCode"></div>
        <div class="form-group">
            <label>Khối Lớp:</label>
            <select id="inputExamGrade">
                <option value="Lớp 10">Lớp 10</option>
                <option value="Lớp 11">Lớp 11</option>
                <option value="Lớp 12">Lớp 12</option>
            </select>
        </div>
        <div class="form-group">
            <label>Môn Học:</label>
            <select id="inputExamSubject">
                <option value="Toán">Toán</option>
                <option value="Văn">Văn</option>
                <option value="Tiếng Anh">Tiếng Anh</option>
                <option value="Vật Lý">Vật Lý</option>
            </select>
        </div>
        <div class="form-group"><label>File Excel:</label><input type="file" id="excelFileInput"></div>
        <button onclick="uploadExamFromExcel()" class="btn-success">Lưu Đề Thi</button>
    </div>
</div>

<script>
    const API_URL = "http://localhost:3000/api";
    let currentUser = null;

    async function fetchAuth(url, options = {}) {
        const token = sessionStorage.getItem("access_token");
        const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        return await fetch(url, { ...options, headers });
    }

    async function handleLogin(role) {
        const username = document.getElementById('authUsername').value.trim();
        const password = document.getElementById('authPassword').value.trim();
        const res = await fetch(`${API_URL}/login`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username, password, role })
        });
        const data = await res.json();
        if (data.success) {
            sessionStorage.setItem("current_user", JSON.stringify(data));
            sessionStorage.setItem("access_token", data.token);
            checkLoginState();
        } else alert(data.message);
    }

    function checkLoginState() {
        currentUser = JSON.parse(sessionStorage.getItem("current_user"));
        document.getElementById('sectionAuth').classList.toggle('hidden', !!currentUser);
        document.getElementById('btnLogout').classList.toggle('hidden', !currentUser);
        document.getElementById('btnShop').classList.toggle('hidden', !currentUser || currentUser.role !== 'student');
        document.getElementById('mcionBox').classList.toggle('hidden', !currentUser);

        if (currentUser) {
            document.getElementById('userInfo').textContent = currentUser.fullname;
            document.getElementById('userAvatar').textContent = currentUser.avatar || '🎓';
            document.getElementById('userMcion').textContent = currentUser.mcion || 0;

            if (currentUser.role === 'student') {
                document.getElementById('sectionStudent').classList.remove('hidden');
                loadExamList();
            } else {
                document.getElementById('sectionAdmin').classList.remove('hidden');
            }
        } else {
            document.getElementById('sectionStudent').classList.add('hidden');
            document.getElementById('sectionAdmin').classList.add('hidden');
            document.getElementById('sectionShop').classList.add('hidden');
        }
    }

    // NẠP ĐỀ THI THEO BỘ LỌC (MÔN HỌC & LỚP)
    async function loadExamList() {
        const grade = document.getElementById('filterGrade').value;
        const subject = document.getElementById('filterSubject').value;
        const res = await fetchAuth(`${API_URL}/exams?grade=${encodeURIComponent(grade)}&subject=${encodeURIComponent(subject)}`);
        const exams = await res.json();
        
        document.getElementById('selectExamCode').innerHTML = '<option value="">-- Chọn đề thi --</option>' + 
            exams.map(e => `<option value="${e.examCode}">[${e.grade} - ${e.subject}] ${e.examCode}</option>`).join('');
    }

    // CỬA HÀNG VÀ ĐỔI AVATAR
    async function openShopModal() {
        if (!currentUser) return;
        document.getElementById('sectionShop').classList.remove('hidden');
        const res = await fetch(`${API_URL}/shop/avatars`);
        const avatars = await res.json();

        const grid = document.getElementById('shopListGrid');
        grid.innerHTML = avatars.map(item => {
            const isOwned = currentUser.inventory.includes(item.id);
            const isEquipped = currentUser.avatar === item.id;

            let actionBtn = '';
            if (isEquipped) actionBtn = '<b style="color:#2ecc71;">[Đang Mặc]</b>';
            else if (isOwned) actionBtn = `<button class="btn-primary" onclick="equipAvatar('${item.id}')">Đổi Avatar</button>`;
            else actionBtn = `<button class="btn-warning" onclick="buyAvatar('${item.id}')">Mua (${item.price}🪙)</button>`;

            return `<div class="shop-item">
                <div style="font-size:36px;">${item.id}</div>
                <div><b>${item.name}</b></div>
                <div style="margin-top:8px;">${actionBtn}</div>
            </div>`;
        }).join('');
    }

    function closeShopModal() {
        document.getElementById('sectionShop').classList.add('hidden');
    }

    async function buyAvatar(avatarId) {
        const res = await fetchAuth(`${API_URL}/shop/buy-avatar`, { method: 'POST', body: JSON.stringify({ avatarId }) });
        const data = await res.json();
        alert(data.message);
        if (data.success) {
            sessionStorage.setItem("current_user", JSON.stringify(data));
            checkLoginState();
            openShopModal();
        }
    }

    async function equipAvatar(avatarId) {
        const res = await fetchAuth(`${API_URL}/user/change-avatar`, { method: 'POST', body: JSON.stringify({ avatarId }) });
        const data = await res.json();
        if (data.success) {
            sessionStorage.setItem("current_user", JSON.stringify(data));
            checkLoginState();
            openShopModal();
        }
    }

    function logout() {
        sessionStorage.clear();
        checkLoginState();
    }

    checkLoginState();
</script>
</body>
</html>
